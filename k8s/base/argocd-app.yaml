apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: amarathon
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://git.krishnarajthadesar.in/krishnaraj/amarathon
        targetRevision: main
        path: k8s/overlays/gitea
    destination:
        server: https://kubernetes.default.svc
        namespace: amarathon
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
