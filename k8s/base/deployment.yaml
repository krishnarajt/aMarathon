apiVersion: apps/v1
kind: Deployment
metadata:
  name: amarathon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amarathon
  template:
    metadata:
      labels:
        app: amarathon
    spec:
      containers:
        - name: app
          image: amarathon
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - secretRef:
                name: amarathon-env

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
