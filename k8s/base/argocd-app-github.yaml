# Alternative to argocd-app.yaml, which tracks the Gitea repo/overlay.
# Apply only one of the two: both render the same Deployment, Service and
# NodePort 32040 into amarathon, so running both leaves two
# self-healing Applications fighting over the same resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: amarathon-github
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/krishnarajt/amarathon
        targetRevision: main
        path: k8s/overlays/github
    destination:
        server: https://kubernetes.default.svc
        namespace: amarathon
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
