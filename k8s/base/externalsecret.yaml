apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amarathon-env
  namespace: amarathon
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: amarathon-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Vault key holding the env for this app. Expected keys:
        #   DATABASE_URL, SECRET_KEY, GATEWAY_SHARED_SECRET, CORS_ORIGINS,
        #   MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
        #   MINIO_BUCKET, MINIO_REGION,
        #   USE_ALEMBIC_MIGRATIONS, LOG_LEVEL
        key: apps/amarathon/amarathon/env
